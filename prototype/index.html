/* ═══════════════════════════════════════════════════════════════════
   REASONING-FIRST PROBLEM ENVIRONMENT — prototype, problem set v2
   01 · ¹³⁷Cs decay identification (Q-values, mass excesses)
   02 · γ shielding (exponential attenuation, half-value layer)
   03 · ²³⁵U fission (binding energy, Q-value, rest-mass fraction)
   04 · p + p in the Sun (Coulomb barrier vs kT, tunnelling)
   05 · Neutron moderation (elastic kinematics, collisions to thermal)

   Pedagogy: commit-before-compute. Each stage locks until the
   previous reasoning commitment is made. The AI coach is Socratic:
   it questions, it never answers. Problems are pure config driving
   one shared five-stage engine — adding a problem is data entry.
   ═══════════════════════════════════════════════════════════════════ */

/* ─── AI LAYER ──────────────────────────────────────────────────────
   Two routes, chosen at run time:
   · On Vercel (or any host): POST to /api/coach. That function holds
     the Anthropic API key and builds the system prompt server-side
     from coach-data.js; the page sends only the problem id, the
     student's reasoning trace and the chat so far.
   · As a published Claude artifact: the viewer's own Claude sign-in
     (the artifact "sample" capability), with the prompt built here.
   ──────────────────────────────────────────────────────────────── */

const COACH_ENDPOINT = "/api/coach";
const buildSystem = (id) => window.COACH_DATA.buildSystem(id);

let samplePromise = null;
function getSample() {
  if (!samplePromise) {
    samplePromise =
      window.claude && typeof window.claude.use === "function"
        ? window.claude.use("sample").catch(() => null)
        : Promise.resolve(null);
  }
  return samplePromise;
}

async function askCoachServer({ problemId, trace, stageLabel, thread }) {
  let res;
  try {
    res = await fetch(COACH_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        problemId,
        trace,
        stageLabel,
        thread: thread.filter((m) => !m.error).map((m) => ({ role: m.role, text: m.text })),
      }),
    });
  } catch (e) {
    const err = new Error("Coach unreachable");
    err.code = "network";
    throw err;
  }
  const body = await res.json().catch(() => ({}));
  if (!res.ok || !body.text) {
    const err = new Error(body.error || `Coach error ${res.status}`);
    err.code = body.code || (res.status === 429 ? "rate_limited" : "server");
    throw err;
  }
  return body.text;
}

async function askCoach({ problemId, trace, stageLabel, thread }) {
  const sample = await getSample();
  if (!sample) return askCoachServer({ problemId, trace, stageLabel, thread });
  const system = buildSystem(problemId);
  const contextBlock = `STUDENT REASONING TRACE SO FAR:\n${trace}\n\nCURRENT STAGE: ${stageLabel}\n\nThe conversation below is between you (coach) and the student, within this stage.`;
  const messages = [];
  messages.push({
    role: "user",
    content:
      `COACH INSTRUCTIONS (follow throughout):\n${system}\n\n---\n\n` +
      contextBlock +
      (thread.length === 0
        ? "\n\n(The student has just opened the coach panel. Greet them in one short sentence and ask one opening question suited to this stage.)"
        : ""),
  });
  // Thread always begins with the coach's greeting, so mapping it directly
  // after the context block keeps user/assistant turns strictly alternating.
  // Error notes are shown to the student but never sent to the coach.
  thread
    .filter((m) => !m.error)
    .forEach((m) => {
      const role = m.role === "coach" ? "assistant" : "user";
      const last = messages[messages.length - 1];
      if (last && last.role === role) last.content += "\n\n" + m.text;
      else messages.push({ role, content: m.text });
    });
  const res = await sample(messages, { cache: false });
  if (!res || !res.text) throw new Error("No response");
  return res.text.trim();
}

function coachErrorText(e) {
  const code = e && e.code;
  if (code === "not_granted")
    return "The coach needs Claude access to run here — open this page signed in to Claude and allow it to ask Claude when prompted.";
  if (code === "not_configured") return "The coach isn’t switched on for this site yet — let your lecturer know.";
  if (code === "rate_limited") return "The coach is getting a lot of questions right now — give it a minute and try again.";
  return "The coach couldn't be reached just now — try again in a moment.";
}

function CoachPanel({ problemId, trace, stageLabel, stageNum, thread, setThread }) {
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [expanded, setExpanded] = useState(false);
  const [showHelp, setShowHelp] = useState(false);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    if (expanded && bottomRef.current) bottomRef.current.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, [thread, busy, expanded]);

  const focusInput = () => setTimeout(() => inputRef.current && inputRef.current.focus(), 0);

  const send = async (text) => {
    if (busy) return;
    const newThread = text ? [...thread, { role: "student", text }] : [...thread];
    if (text) setThread(newThread);
    setBusy(true);
    try {
      const reply = await askCoach({ problemId, trace, stageLabel, thread: newThread });
      setThread([...newThread, { role: "coach", text: reply }]);
    } catch (e) {
      setThread([...newThread, { role: "coach", text: coachErrorText(e), error: true }]);
    }
    setBusy(false);
  };

  const expand = () => {
    setExpanded(true);
    setShowHelp(false);
    if (thread.length === 0 && !busy) send(null);
    focusInput();
  };

  const starter = (val) => {
    setExpanded(true);
    setShowHelp(false);
    if (val === "think") {
      setInput("Here’s my thinking: ");
      if (thread.length === 0) send(null);
      focusInput();
      return;
    }
    send(val);
  };

  const submit = () => {
    if (input.trim() && !busy) {
      setExpanded(true);
      setShowHelp(false);
      send(input.trim());
      setInput("");
    }
  };

  const USES = [
    ["Test your reasoning before you commit", "Explain your thinking in a sentence. The coach asks the one question that would expose a gap."],

              <span aria-hidden="true" className="inline-block rounded-full flex-shrink-0" style={{ width: 10, height: 10, background: dot }} />
              <span style={{ fontFamily: F.phys, fontSize: 24, fontWeight: 600, lineHeight: 1.1, color: C.ink }}>Coach</span>
              <span style={{ fontSize: 14, color: C.ink, minWidth: 0 }}>
                Discuss <b style={{ fontWeight: 600 }}>Stage {stageNum}</b> here<span className="hidden sm:inline"> — it asks you questions, never gives answers</span>
              </span>
              {helpButton(false)}
              {thread.length > 0 && (
                <button

  return (

/* ─── Problem engine: one five-stage machine, config-driven ──────── */

function ProblemEngine({ p }) {
  const [current, setCurrent] = useState(0);
  const [furthest, setFurthest] = useState(0);
  const [threads, setThreads] = useState({});

  const [hypo, setHypo] = useState(null);
  const [hypoWhy, setHypoWhy] = useState("");
  const [c1, setC1] = useState(null);

  const [scale, setScale] = useState(null);
  const [pred, setPred] = useState(null);
  const [c2, setC2] = useState(null);

  const [f0, setF0] = useState(null);
  const [f1, setF1] = useState(null);
  const [fAttempts, setFAttempts] = useState(0);
  const [fWrong, setFWrong] = useState(false);
  const [c3, setC3] = useState(null);

  const [nums, setNums] = useState({});
  const [sAttempts, setSAttempts] = useState(0);
  const [sResult, setSResult] = useState(null);
  const [c4, setC4] = useState(null);

  const [verdict, setVerdict] = useState("");
  const [done, setDone] = useState(false);

  const st = { c1, c2, c3, c4 };

  const statuses = STAGES.map((s, i) => {
    const committed = [c1, c2, c3, c4, done ? {} : null][i];
    if (committed) return "done";
    if (i <= furthest) return "open";
    return "locked";
  });

  const summaries = [
    c1 ? `hypothesis: ${p.hypotheses.find((h) => h.id === c1.hypo)?.label}` : "",
    c2 ? `${p.est.options.find((o) => o.id === c2.scale)?.label} · ${p.pred.options.find((o) => o.id === c2.pred)?.label?.split(" ")[0]}` : "",
    c3 ? "expressions assembled" : "",
    c4 ? p.numFields.map((f) => `${f.key}=${c4.vals[f.key]}`).join(", ") : "",
    done ? "verdict delivered" : "",
  ];

  const buildTrace = () => {
    const lines = [];
    if (c1) lines.push(`Stage I (hypothesis): "${p.hypotheses.find((h) => h.id === c1.hypo)?.label}". Justification: "${c1.why}"`);
    if (c2)
      lines.push(
        `Stage II (estimate): chose "${p.est.options.find((o) => o.id === c2.scale)?.label}" for "${p.est.q}"; predicted "${p.pred.options.find((o) => o.id === c2.pred)?.label}" for "${p.pred.q}"`
      );
    if (c3)
      lines.push(
        `Stage III (formulate): chose "${p.forms[0].options.find((f) => f.id === c3.f0)?.tex}" and "${p.forms[1].options.find((f) => f.id === c3.f1)?.tex}" (confirmed after ${c3.attempts} attempt(s)).`
      );
    else if (fAttempts > 0)
      lines.push(
        `Stage III in progress: ${fAttempts} incorrect formulation attempt(s). Latest choices: "${f0 ? p.forms[0].options.find((f) => f.id === f0)?.tex : "none"}", "${f1 ? p.forms[1].options.find((f) => f.id === f1)?.tex : "none"}".`
      );
    if (c4)
      lines.push(
        `Stage IV (solve): committed ${p.numFields
          .map((f) => `${f.label} = ${c4.vals[f.key]} ${f.unit} (${c4.oks[f.key] ? "matches data" : "does not match data"})`)
          .join("; ")}.`
      );
    else if (sAttempts > 0)
      lines.push(`Stage IV in progress: ${sAttempts} numeric attempt(s), latest ${p.numFields.map((f) => `${f.key}="${nums[f.key] || ""}"`).join(", ")}.`);
    if (verdict) lines.push(`Stage V draft verdict: "${verdict}"`);
    return lines.length ? lines.join("\n") : "(nothing committed yet)";
  };

  const setThread = (id) => (t) => setThreads((prev) => ({ ...prev, [id]: t }));
  const thread = (id) => threads[id] || [];
  const advance = (i) => {
    setFurthest((f) => Math.max(f, i + 1));
    setCurrent(i + 1);
  };
  const num = (s) => {
    const v = parseFloat(String(s).replace(",", "."));
    return Number.isFinite(v) ? v : null;
  };

  const stageHeader = (i) => (
    <div className="mb-4">
      <div style={{ fontFamily: F.mono, fontSize: 11, letterSpacing: "0.12em", color: C.beta }}>
        STAGE {STAGES[i].n} · {STAGES[i].verb.toUpperCase()}
      </div>
      <h2 style={{ fontFamily: F.phys, fontSize: 26, fontWeight: 600, color: C.ink, lineHeight: 1.15 }}>{STAGES[i].title}</h2>
      <p style={{ fontFamily: F.ui, fontSize: 14, color: C.inkSoft, marginTop: 4, maxWidth: 560 }}>{p.subs[i]}</p>
    </div>
  );

  const renderIdentify = () => (
    <div>
      {stageHeader(0)}
      {p.figs?.identify && <Figure id={p.figs.identify} />}
      {c1 ? (
        <Committed>
          <div style={{ fontFamily: F.ui, fontSize: 13, color: C.ink }}>
            <strong>Committed:</strong> {p.hypotheses.find((h) => h.id === c1.hypo)?.label}
          </div>
          <div style={{ fontFamily: F.phys, fontSize: 14, color: C.inkSoft, fontStyle: "italic", marginTop: 2 }}>“{c1.why}”</div>
          <div style={{ fontFamily: F.mono, fontSize: 10.5, color: C.inkSoft, marginTop: 4 }}>
            Commitments are permanent — the later stages will test this hypothesis against the data.
          </div>
        </Committed>
      ) : (
        <>
          <Field label={p.hypoLabel}>
            <Radio options={p.hypotheses} value={hypo} onChange={setHypo} />
          </Field>
          <Field label="Justify it — one or two sentences of physics">
            <textarea
              value={hypoWhy}
              onChange={(e) => setHypoWhy(e.target.value)}
              rows={3}
              placeholder={p.hypoPlaceholder}
              className="w-full rounded-sm px-3 py-2"
              style={{ border: `1.5px solid ${C.line}`, fontFamily: F.phys, fontSize: 15, color: C.ink, outline: "none", resize: "vertical", background: C.card }}
            />
          </Field>
          <CommitButton
            disabled={!hypo || hypoWhy.trim().length < 25}
            onClick={() => {
              setC1({ hypo, why: hypoWhy.trim() });
              advance(0);
            }}
          >
            Commit hypothesis → unlock Stage II
          </CommitButton>
          {(!hypo || hypoWhy.trim().length < 25) && (
            <LockNote>
              Stage II stays locked until you commit a hypothesis with a real justification (a sentence or two). There's no marking here — this is a prediction the
              data will test.
            </LockNote>
          )}
        </>
      )}
    </div>
  );

  const renderEstimate = () => (
    <div>
      {stageHeader(1)}
      {c2 ? (
        <Committed>
          <div style={{ fontFamily: F.ui, fontSize: 13, color: C.ink }}>
            <strong>Committed:</strong> {p.est.options.find((o) => o.id === c2.scale)?.label} · {p.pred.options.find((o) => o.id === c2.pred)?.label}
          </div>
        </Committed>
      ) : (
        <>
          <Field label={p.est.q}>
            <Chips options={p.est.options} value={scale} onChange={setScale} />
          </Field>
          <Field label={p.pred.q}>
            <Radio options={p.pred.options} value={pred} onChange={setPred} soft={C.alphaSoft} />
          </Field>
          <CommitButton
            disabled={!scale || !pred}
            onClick={() => {
              setC2({ scale, pred });
              advance(1);
            }}
          >
            Commit estimate → unlock Stage III
          </CommitButton>
          {(!scale || !pred) && <LockNote>The formulation stage unlocks once both commitments are made. A wrong estimate costs nothing — an uncommitted one teaches nothing.</LockNote>}
        </>
      )}
    </div>
  );

  const renderFormulate = () => (
    <div>
      {stageHeader(2)}
      {c3 ? (
        <Committed>
          <div style={{ fontFamily: F.mono, fontSize: 13, color: C.ink }}>{p.forms[0].options.find((f) => f.id === c3.f0)?.tex}</div>
          <div style={{ fontFamily: F.mono, fontSize: 13, color: C.ink }}>{p.forms[1].options.find((f) => f.id === c3.f1)?.tex}</div>
          <div style={{ fontFamily: F.mono, fontSize: 10.5, color: C.inkSoft, marginTop: 4 }}>Formulation confirmed after {c3.attempts} attempt(s).</div>
        </Committed>
      ) : (
        <>
          <Field label={p.forms[0].label}>
            <Radio
              options={p.forms[0].options.map((f) => ({ id: f.id, tex: f.tex }))}
              value={f0}
              onChange={(v) => {
                setF0(v);
                setFWrong(false);
              }}
            />
          </Field>
          <Field label={p.forms[1].label}>
            <Radio
              options={p.forms[1].options.map((f) => ({ id: f.id, tex: f.tex }))}
              value={f1}
              onChange={(v) => {
                setF1(v);
                setFWrong(false);
              }}
            />
          </Field>
          {fWrong && (
            <div className="rounded-sm px-3 py-2 mb-3" style={{ background: C.dangerSoft, border: `1.5px solid ${C.danger}`, fontFamily: F.ui, fontSize: 13, color: C.ink }}>
              At least one expression doesn't hold up. No answer given — that's the coach's job to help you find. ({fAttempts} attempt{fAttempts === 1 ? "" : "s"} so far.)
            </div>
          )}
          <CommitButton
            disabled={!f0 || !f1}
            onClick={() => {
              const ok = p.forms[0].options.find((f) => f.id === f0)?.correct && p.forms[1].options.find((f) => f.id === f1)?.correct;
              if (ok) {
                setC3({ f0, f1, attempts: fAttempts + 1 });
                advance(2);
              } else {
                setFAttempts((a) => a + 1);
                setFWrong(true);
              }
            }}
          >
            Test formulation {f0 && f1 ? "→ unlock Stage IV if sound" : ""}
          </CommitButton>
          {(!f0 || !f1) && <LockNote>{p.formLockNote}</LockNote>}
        </>
      )}
    </div>
  );

  const renderSolve = () => (
    <div>
      {stageHeader(3)}
      {c4 ? (
        <Committed>
          <div style={{ fontFamily: F.mono, fontSize: 13.5, color: C.ink }}>
            {p.numFields.map((f) => `${f.key} = ${c4.vals[f.key]} ${f.unit} ${c4.oks[f.key] ? "✓" : "✗"}`).join(" · ")}
          </div>
        </Committed>
      ) : (
        <>
          <div className="flex flex-wrap gap-4 mb-4">
            {p.numFields.map((f) => {
              const ok = sResult ? sResult[f.key] : undefined;
              return (
                <div key={f.key}>
                  <div style={{ fontFamily: F.ui, fontSize: 11, fontWeight: 600, letterSpacing: "0.08em", textTransform: "uppercase", color: C.inkSoft }} className="mb-1.5">
                    {f.label}
                  </div>
                  <div className="flex items-center gap-2">
                    <input
                      value={nums[f.key] || ""}
                      onChange={(e) => {
                        setNums((prev) => ({ ...prev, [f.key]: e.target.value }));
                        setSResult(null);
                      }}
                      placeholder="0.00"
                      inputMode="decimal"
                      aria-label={f.label}
                      className="rounded-sm px-3 py-2"
                      style={{
                        width: 120,
                        border: `1.5px solid ${ok === false ? C.danger : ok ? C.stable : C.line}`,
                        fontFamily: F.mono,
                        fontSize: 16,
                        color: C.ink,
                        outline: "none",
                        background: C.card,
                      }}
                    />
                    <span style={{ fontFamily: F.mono, fontSize: 13, color: C.inkSoft }}>{f.unit}</span>
                    {ok === true && <span style={{ color: C.stable, fontFamily: F.mono }}>✓</span>}
                    {ok === false && <span style={{ color: C.danger, fontFamily: F.mono }}>✗</span>}
                  </div>
                </div>
              );
            })}
          </div>
          {sResult && p.numFields.some((f) => !sResult[f.key]) && (
            <div className="rounded-sm px-3 py-2 mb-3" style={{ background: C.dangerSoft, border: `1.5px solid ${C.danger}`, fontFamily: F.ui, fontSize: 13, color: C.ink }}>
              {p.numFields.every((f) => !sResult[f.key]) ? "Neither value matches the data yet." : "One value doesn't match the data yet."} {p.numHint} ({sAttempts}{" "}
              attempt{sAttempts === 1 ? "" : "s"}.)
            </div>
          )}
          <div className="flex gap-2 items-center flex-wrap">
            <CommitButton
              disabled={p.numFields.some((f) => num(nums[f.key]) === null)}
              onClick={() => {
                const res = {};
                p.numFields.forEach((f) => {
                  res[f.key] = Math.abs(num(nums[f.key]) - f.ans) <= f.tol;
                });
                setSAttempts((n) => n + 1);
                setSResult(res);
                if (p.numFields.every((f) => res[f.key])) {
                  const vals = {};
                  const oks = {};
                  p.numFields.forEach((f) => {
                    vals[f.key] = num(nums[f.key]).toFixed(f.dp);
                    oks[f.key] = true;
                  });
                  setC4({ vals, oks });
                  advance(3);
                }
              }}
            >
              Check values {p.numFields.every((f) => num(nums[f.key]) !== null) ? "→ unlock Stage V if right" : ""}
            </CommitButton>
            {sAttempts >= 3 && (
              <button
                onClick={() => {
                  const vals = {};
                  const oks = {};
                  p.numFields.forEach((f) => {
                    vals[f.key] = nums[f.key] || "—";
                    oks[f.key] = !!(sResult && sResult[f.key]);
                  });
                  setC4({ vals, oks });
                  advance(3);
                }}
                className="rounded-sm px-3 py-2"
                style={{ fontFamily: F.ui, fontSize: 12.5, color: C.inkSoft, border: `1.5px dashed ${C.line}`, background: C.card }}
              >
                Proceed anyway and reconcile
              </button>
            )}
          </div>
          {p.numFields.some((f) => num(nums[f.key]) === null) && <LockNote>{p.numLockNote}</LockNote>}
        </>
      )}
    </div>
  );

  const renderReconcile = () => (
    <div>
      {stageHeader(4)}
      <div className="rounded-sm mb-4 overflow-hidden" style={{ border: `1.5px solid ${C.ink}` }}>
        {p.recon.map((r, i) => {
          const ok = r.ok(st, p);
          return (
            <div key={i} className="flex flex-col sm:flex-row" style={{ borderTop: i ? `1px solid ${C.line}` : "none" }}>
              <div className="px-3 py-2 sm:w-1/3" style={{ background: C.paper, fontFamily: F.ui, fontSize: 12.5, fontWeight: 600, color: C.ink }}>{r.q}</div>
              <div className="px-3 py-2 sm:w-1/3" style={{ fontFamily: F.phys, fontSize: 14, color: C.ink }}>{r.yours(st, p)}</div>
              <div className="px-3 py-2 sm:w-1/3 flex items-center gap-2" style={{ fontFamily: F.mono, fontSize: 12, color: ok ? C.stable : C.danger }}>
                {r.data(st, p)} {ok ? "· agrees" : "· tension"}
              </div>
            </div>
          );
        })}
      </div>
      {p.figs?.reconcile && <Figure id={p.figs.reconcile} />}
      {done ? (
        <div className="rounded-sm px-4 py-3" style={{ background: C.stableSoft, border: `1.5px solid ${C.stable}` }}>
          <div style={{ fontFamily: F.ui, fontWeight: 600, fontSize: 14, color: C.stable }}>Problem complete — reasoning trace recorded</div>
          <div style={{ fontFamily: F.phys, fontSize: 15, color: C.ink, fontStyle: "italic", marginTop: 4 }}>“{verdict}”</div>
          <div style={{ fontFamily: F.ui, fontSize: 13, color: C.inkSoft, marginTop: 8 }}>{p.enrichment}</div>
        </div>
      ) : (
        <>
          <Field label={p.verdictPrompt}>
            <textarea
              value={verdict}
              onChange={(e) => setVerdict(e.target.value)}
              rows={4}
              placeholder={p.verdictPlaceholder}
              className="w-full rounded-sm px-3 py-2"
              style={{ border: `1.5px solid ${C.line}`, fontFamily: F.phys, fontSize: 15, color: C.ink, outline: "none", resize: "vertical", background: C.card }}
            />
          </Field>
          <CommitButton disabled={verdict.trim().length < 60} onClick={() => setDone(true)}>
            Deliver verdict — complete the problem
          </CommitButton>
          {verdict.trim().length < 60 && (
            <LockNote>
              A verdict needs substance — a couple of sentences connecting the calculation to the physical outcome, and an honest word about any commitment the data
              overturned.
            </LockNote>
          )}
        </>
      )}
    </div>
  );

  const renderers = [renderIdentify, renderEstimate, renderFormulate, renderSolve, renderReconcile];
  const stageThread = thread(STAGES[current].id);

  return (
    <div>
      {/* Problem header */}
      <div className="px-4 md:px-8 pt-5 pb-3" style={{ background: C.card, borderBottom: `1px solid ${C.line}` }}>
        <div className="max-w-5xl mx-auto">
          <h1 style={{ fontFamily: F.phys, fontSize: 28, fontWeight: 600, color: C.ink, lineHeight: 1.12, marginTop: 0 }}>{p.title}</h1>
          <p style={{ fontFamily: F.ui, fontSize: 13.5, color: C.inkSoft, marginTop: 4, maxWidth: 660 }}>{p.intro}</p>
        </div>
      </div>

      {/* Data strip */}
      <div className="px-4 md:px-8 py-3" style={{ background: C.card, borderBottom: `1px solid ${C.line}` }}>
        <div className="max-w-5xl mx-auto">
          <div style={{ fontFamily: F.ui, fontSize: 10.5, fontWeight: 600, letterSpacing: "0.1em", textTransform: "uppercase", color: C.inkSoft }} className="mb-2">
            {p.dataLabel}
          </div>
          <div className="flex gap-2 flex-wrap">
            {p.squares.map((q) => (
              <DataSquare key={q.main} q={q} />
            ))}
            <div className="flex items-center px-2" style={{ fontFamily: F.mono, fontSize: 11, color: C.inkSoft, maxWidth: 280 }}>{p.dataNote}</div>
          </div>
        </div>
      </div>

      {/* Body */}
      <main className="px-4 md:px-8 py-5" style={{ paddingBottom: 200 }}>
        <div className="max-w-5xl mx-auto flex flex-col gap-4">
          <section className="rounded-sm px-4 py-4 md:px-6 md:py-5" style={{ background: C.card, border: `1.5px solid ${C.ink}` }}>
            {renderers[current]()}
          </section>

          <CoachPanel
            key={STAGES[current].id}
            problemId={p.id}
            trace={buildTrace()}
            stageLabel={`Stage ${STAGES[current].n} — ${STAGES[current].title}`}
            stageNum={STAGES[current].n}
            thread={stageThread}
            setThread={setThread(STAGES[current].id)}
          />
        </div>
      </main>
    </div>
  );
}

            <span style={{ fontFamily: F.ui, fontSize: 13.5, lineHeight: 1.55, color: "#D8DEE3" }}>
              <b style={{ color: "#FFFFFF" }}>A coach is on hand at every stage.</b> It reads what you’ve committed and answers only with questions — never the answer — so the thinking stays yours.
            </span>
          </div>
        </section>

        <section aria-labelledby="choose-title">
          <h2 id="choose-title" style={{ margin: "0 0 12px", fontFamily: F.phys, fontSize: 22, fontWeight: 600, color: C.ink }}>Choose a problem</h2>
          <div className="grid gap-4" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))" }}>
            {PROBLEMS.map((p, i) => (
              <div key={p.id} className="flex flex-col gap-2.5 rounded-sm" style={{ padding: "20px 22px", background: C.card, border: `1.5px solid ${C.ink}` }}>

/* ─── App shell ──────────────────────────────────────────────────── */

const EDUCATOR_NOTES =
  "This environment enforces commit-before-compute: students must frame the physics (ILO 1), estimate, and formulate (ILO 2–3) before numeric work unlocks. The AI coach is constrained to Socratic questioning — it is prompted never to state, confirm or deny answers, so the valuable cognitive work cannot be delegated to it; that constraint is what makes the task AI-aware by construction. Every attempt produces a structured reasoning trace (hypothesis, estimates, formulation attempts, numeric attempts, verdict) which the coach reads and which could be aggregated per cohort to locate where reasoning breaks. Problems are pure configuration driving a shared five-stage engine — Problem 01 exercises decay identification and Q-value energetics; Problem 02 exponential attenuation and shielding; Problem 03 fission energetics from the binding-energy curve; Problem 04 the Coulomb barrier and tunnelling in stellar fusion; Problem 05 neutron moderation kinematics. Adding another problem is data entry, not development. The AI call is a single swappable function, ready to be pointed at an institution-funded API proxy for deployment.";

function App() {
  const [screen, setScreen] = useState("intro"); // "intro" | problem index
  const [visited, setVisited] = useState({});
  const [showEducator, setShowEducator] = useState(false);

  const openProblem = (i) => {
    setVisited((v) => ({ ...v, [i]: true }));
    setScreen(i);
    try { window.scrollTo(0, 0); } catch (e) {}
  };

  return (
    <div
      style={{
        minHeight: "100vh",
        background: `linear-gradient(${C.grid} 1px, transparent 1px), linear-gradient(90deg, ${C.grid} 1px, transparent 1px)`,
        backgroundSize: "28px 28px",
        backgroundColor: C.paper,
      }}
    >
      <style>{`
        button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid ${C.beta}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
      `}</style>

      <header className="px-4 md:px-8" style={{ paddingTop: screen === "intro" ? 12 : 16, paddingBottom: screen === "intro" ? 12 : 0, borderBottom: `1.5px solid ${C.ink}`, background: C.card }}>
        <div className="max-w-5xl mx-auto">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <button
              type="button"
              onClick={() => setScreen("intro")}
              aria-label="Problem set — back to the introduction"
              style={{ minHeight: 44, padding: 0, background: "transparent", border: "none", fontFamily: F.mono, fontSize: 11.5, letterSpacing: "0.14em", color: C.ink, cursor: "pointer" }}
            >
              PROBLEM SET
            </button>
            <button
              type="button"
              onClick={() => setShowEducator((v) => !v)}
              aria-expanded={showEducator}
              className="rounded-sm"
              style={{ minHeight: 44, padding: "0 14px", fontFamily: F.ui, fontSize: 12.5, color: C.inkSoft, border: `1px solid ${C.line}`, background: C.paper, cursor: "pointer" }}
            >
              {showEducator ? "Hide notes" : "For educators"}
            </button>
          </div>
          {showEducator && (
            <div className="mt-3 rounded-sm px-4 py-3" style={{ background: C.paper, border: `1px solid ${C.line}`, fontFamily: F.ui, fontSize: 13, lineHeight: 1.55, color: C.ink, marginBottom: screen === "intro" ? 0 : 4 }}>
              <strong>Design notes.</strong> {EDUCATOR_NOTES}
            </div>
          )}
          {screen !== "intro" && (
            <nav aria-label="Problems" className="flex gap-1 mt-2.5 overflow-x-auto">
              {PROBLEMS.map((p, i) => (
                <button
                  key={p.id}
                  type="button"
                  onClick={() => openProblem(i)}
                  aria-current={screen === i ? "page" : undefined}
                  className="rounded-t-sm"
                  style={{
                    minHeight: 44,
                    padding: "0 16px",
                    fontFamily: F.mono,
                    fontSize: 12.5,
                    fontWeight: 500,
                    color: screen === i ? C.ink : C.inkSoft,
                    background: screen === i ? C.paper : "transparent",
                    borderTop: `1.5px solid ${screen === i ? C.ink : "transparent"}`,
                    borderLeft: `1.5px solid ${screen === i ? C.ink : "transparent"}`,
                    borderRight: `1.5px solid ${screen === i ? C.ink : "transparent"}`,
                    borderBottom: "none",
                    whiteSpace: "nowrap",
                    flexShrink: 0,
                    cursor: "pointer",
                  }}
                >
                  {p.tab}
                </button>
              ))}
            </nav>
          )}
        </div>
      </header>

      {screen === "intro" && <Intro onStart={openProblem} />}

      {/* Engines stay mounted once visited so progress survives switching */}
      {PROBLEMS.map((p, i) =>
        visited[i] ? (
          <div key={p.id} style={{ display: screen === i ? "block" : "none" }}>
            <ProblemEngine p={p} />
          </div>
        ) : null
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
